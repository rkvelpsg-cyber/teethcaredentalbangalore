<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Login - ASIAN DENTAL CLINIC</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica",
          "Arial", sans-serif;
        background: linear-gradient(135deg, #0f766e 0%, #06b6d4 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 420px;
        padding: 40px;
        animation: slideInUp 0.6s ease;
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-header {
        text-align: center;
        margin-bottom: 32px;
      }

      .login-icon {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 32px;
        color: #fff;
      }

      .login-header h1 {
        font-size: 1.8rem;
        color: #0f172a;
        margin-bottom: 8px;
      }

      .login-header p {
        color: #64748b;
        font-size: 0.95rem;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        color: #0f172a;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.9rem;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        font-family: inherit;
      }

      input:focus {
        outline: none;
        border-color: #059669;
        background: #f0fdf4;
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
      }

      .submit-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 24px;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(5, 150, 105, 0.3);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
      }

      .back-link a {
        color: #059669;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
      }

      .back-link a:hover {
        color: #047857;
      }

      .demo-credentials {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 8px;
        padding: 12px 14px;
        margin-top: 20px;
        font-size: 0.85rem;
        color: #166534;
      }

      .demo-credentials strong {
        display: block;
        margin-bottom: 6px;
        color: #15803d;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="login-icon">
          <i class="fas fa-stethoscope"></i>
        </div>
        <h1>Doctor Portal</h1>
        <p>Access your patient management dashboard</p>
      </div>

      <form id="doctorLoginForm" onsubmit="handleDoctorLogin(event)">
        <div class="form-group">
          <label for="doctorId">Doctor ID</label>
          <input
            type="text"
            id="doctorId"
            name="doctorId"
            placeholder="Enter your Doctor ID"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="submit-btn">
          <i class="fas fa-sign-in-alt"></i> Login to Dashboard
        </button>
      </form>

      <div class="demo-credentials">
        <strong>Demo Credentials:</strong>
        ID: <code>DR001</code> | Password: <code>demo123</code>
      </div>

      <div class="back-link">
        <a
          href="index.html"
          onclick="
            window.close();
            return false;
          "
          >← Back to Clinic Website</a
        >
      </div>
    </div>

    <script>
      function handleDoctorLogin(event) {
        event.preventDefault();
        const doctorId = document.getElementById("doctorId").value;
        const password = document.getElementById("password").value;

        // Demo authentication
        if (doctorId === "DR001" && password === "demo123") {
          // Store session and redirect to dashboard
          localStorage.setItem("doctorId", doctorId);
          localStorage.setItem("doctorName", "Dr. Humayun Aleem");
          window.location.href = "doctor-dashboard.html";
        } else {
          alert(
            "Invalid credentials. Please try again.\n\nDemo: ID: DR001, Password: demo123",
          );
        }
      }
    </script>
  </body>
</html>
