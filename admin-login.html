<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - ASIAN DENTAL CLINIC</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #1e40af 0%, #0ea5e9 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .login-container {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 420px;
        padding: 40px;
        animation: slideUp 0.5s ease;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .login-header {
        text-align: center;
        margin-bottom: 32px;
      }
      .login-icon {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #1e40af, #0ea5e9);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 28px;
        color: #fff;
      }
      .login-header h1 {
        font-size: 1.8rem;
        color: #0f172a;
        margin-bottom: 6px;
      }
      .login-header p {
        color: #64748b;
        font-size: 0.95rem;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #0f172a;
        font-size: 0.9rem;
      }
      input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s;
      }
      input:focus {
        outline: none;
        border-color: #1e40af;
        background: #eff6ff;
      }
      .submit-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #1e40af, #0ea5e9);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .submit-btn:hover {
        opacity: 0.9;
      }
      .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .back-link {
        text-align: center;
        margin-top: 20px;
      }
      .back-link a {
        color: #1e40af;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
      }
      .error-msg {
        margin-top: 14px;
        padding: 10px 14px;
        background: #fee2e2;
        color: #dc2626;
        border-radius: 8px;
        font-size: 0.9rem;
        text-align: center;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="login-icon"><i class="fas fa-user-shield"></i></div>
        <h1>Admin Portal</h1>
        <p>Asian Dental Clinic — Front Desk Access</p>
      </div>

      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label for="adminCode">Admin ID</label>
          <input
            type="text"
            id="adminCode"
            placeholder="Enter your Admin ID"
            required
            autocomplete="username"
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="submit-btn">
          <i class="fas fa-sign-in-alt"></i> Login to Admin Panel
        </button>
      </form>

      <div class="error-msg" id="errorMsg"></div>

      <div class="back-link">
        <a href="doctor-login.html">← Doctor Login</a>
        &nbsp;|&nbsp;
        <a href="index.html">Back to Website</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script>
      async function sha256(text) {
        const data = new TextEncoder().encode(text);
        const hash = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hash))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      async function handleAdminLogin(event) {
        event.preventDefault();
        const btn = document.querySelector(".submit-btn");
        const adminCode = document
          .getElementById("adminCode")
          .value.trim()
          .toLowerCase();
        const password = document.getElementById("password").value;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying…';

        try {
          const hash = await sha256(password);
          const { data, error } = await window._sb
            .from("admins")
            .select("admin_code, name, is_active")
            .eq("admin_code", adminCode)
            .eq("password_hash", hash)
            .eq("is_active", true)
            .single();

          if (error || !data) {
            showError("Invalid Admin ID or password. Please try again.");
            return;
          }
          localStorage.setItem("adminId", data.admin_code);
          localStorage.setItem("adminName", data.name);
          window.location.href = "admin-dashboard.html";
        } catch (err) {
          showError("Something went wrong. Please try again.");
        } finally {
          btn.disabled = false;
          btn.innerHTML =
            '<i class="fas fa-sign-in-alt"></i> Login to Admin Panel';
        }
      }

      function showError(msg) {
        const el = document.getElementById("errorMsg");
        el.textContent = msg;
        el.style.display = "block";
      }
    </script>
  </body>
</html>
