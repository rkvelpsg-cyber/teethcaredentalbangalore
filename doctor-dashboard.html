<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Dashboard - ASIAN DENTAL CLINIC</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica",
          "Arial", sans-serif;
        background: #f5f5f5;
        color: #0f172a;
      }

      .dashboard-container {
        display: grid;
        grid-template-columns: 250px 1fr;
        min-height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        background: linear-gradient(135deg, #0f766e 0%, #06b6d4 100%);
        color: #fff;
        padding: 30px 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: sticky;
        top: 0;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 40px;
        font-size: 1.3rem;
        font-weight: 700;
      }

      .sidebar-header i {
        font-size: 1.8rem;
      }

      .sidebar-menu {
        list-style: none;
        flex: 1;
      }

      .sidebar-menu li {
        margin-bottom: 10px;
      }

      .sidebar-menu a {
        display: flex;
        align-items: center;
        gap: 12px;
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        padding: 12px 14px;
        border-radius: 8px;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .sidebar-menu a:hover,
      .sidebar-menu a.active {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }

      .sidebar-footer {
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .logout-btn {
        width: 100%;
        padding: 10px;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .logout-btn:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      /* Main Content */
      .main-content {
        padding: 30px;
        overflow-y: auto;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        background: #fff;
        padding: 20px 24px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .top-bar h1 {
        font-size: 1.8rem;
        color: #0f172a;
      }

      .doctor-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .doctor-avatar {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 700;
      }

      /* Content Sections */
      .content-section {
        display: none;
      }

      .content-section.active {
        display: block;
      }

      /* Appointments Grid */
      .appointments-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .appointment-card {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        border-left: 4px solid #059669;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .appointment-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      .appointment-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 12px;
      }

      .appointment-header h3 {
        font-size: 1.1rem;
        color: #0f172a;
      }

      .appointment-status {
        display: inline-block;
        padding: 4px 12px;
        background: #e8f5e9;
        color: #2e7d32;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .appointment-details {
        font-size: 0.9rem;
        color: #64748b;
        line-height: 1.8;
      }

      .appointment-details p {
        margin-bottom: 6px;
      }

      .appointment-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .btn-action {
        flex: 1;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
        transition: all 0.3s ease;
      }

      .btn-prescription {
        background: #059669;
        color: #fff;
      }

      .btn-prescription:hover {
        background: #047857;
      }

      .btn-view {
        background: #e0e7ff;
        color: #4f46e5;
      }

      .btn-view:hover {
        background: #c7d2fe;
      }

      /* Prescription Form */
      .prescription-form {
        background: #fff;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .form-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 2px solid #e2e8f0;
      }

      .form-header h2 {
        font-size: 1.5rem;
        color: #0f172a;
      }

      .form-header button {
        margin-left: auto;
        background: #e0e7ff;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        color: #4f46e5;
        font-weight: 600;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
      }

      .form-grid.full {
        grid-template-columns: 1fr;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      label {
        font-weight: 600;
        margin-bottom: 8px;
        color: #0f172a;
        font-size: 0.9rem;
      }

      input,
      textarea,
      select {
        padding: 10px 12px;
        border: 2px solid #e2e8f0;
        border-radius: 6px;
        font-size: 0.9rem;
        font-family: inherit;
        transition: all 0.3s ease;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: #059669;
        background: #f0fdf4;
      }

      textarea {
        resize: vertical;
        min-height: 100px;
      }

      .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
        flex-wrap: nowrap;
      }

      .btn-primary {
        flex: 1;
        min-width: 150px;
        padding: 12px;
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(5, 150, 105, 0.3);
      }

      .btn-secondary {
        flex: 1;
        min-width: 150px;
        padding: 12px;
        background: #f5f5f5;
        color: #0f172a;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-secondary:hover {
        background: #e2e8f0;
      }

      /* Stats Cards */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .stat-icon {
        font-size: 2rem;
        margin-bottom: 12px;
      }

      .stat-value {
        font-size: 1.8rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 4px;
      }

      .stat-label {
        font-size: 0.85rem;
        color: #64748b;
      }

      @media (max-width: 1024px) {
        .dashboard-container {
          grid-template-columns: 1fr;
        }

        .sidebar {
          height: auto;
          flex-direction: row;
          justify-content: space-between;
          align-items: center;
          padding: 20px;
          position: relative;
        }

        .sidebar-header {
          margin-bottom: 0;
        }

        .sidebar-menu {
          display: flex;
          flex: 1;
          gap: 10px;
          margin: 0 20px;
        }

        .sidebar-footer {
          margin-top: 0;
          padding-top: 0;
          border-top: none;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .form-actions {
          flex-direction: column;
        }

        .btn-primary,
        .btn-secondary {
          width: 100%;
          min-width: unset;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <i class="fas fa-stethoscope"></i>
          <span>Doctor Panel</span>
        </div>

        <ul class="sidebar-menu">
          <li>
            <a onclick="switchSection('dashboard')" class="menu-item active">
              <i class="fas fa-chart-line"></i> Dashboard
            </a>
          </li>
          <li>
            <a onclick="switchSection('appointments')" class="menu-item">
              <i class="fas fa-calendar-alt"></i> Appointments
            </a>
          </li>
          <li>
            <a onclick="switchSection('prescription')" class="menu-item">
              <i class="fas fa-prescription-bottle"></i> Write Prescription
            </a>
          </li>
          <li>
            <a onclick="switchSection('history')" class="menu-item">
              <i class="fas fa-history"></i> Prescription History
            </a>
          </li>
        </ul>

        <div class="sidebar-footer">
          <button class="logout-btn" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <!-- Top Bar -->
        <div class="top-bar">
          <h1>Doctor Dashboard</h1>
          <div class="doctor-info">
            <span id="doctorName">Dr. Humayun Aleem</span>
            <div class="doctor-avatar">HA</div>
          </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" class="content-section active">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon" style="color: #059669">
                <i class="fas fa-calendar-check"></i>
              </div>
              <div class="stat-value">12</div>
              <div class="stat-label">Today's Appointments</div>
            </div>

            <div class="stat-card">
              <div class="stat-icon" style="color: #0ea5e9">
                <i class="fas fa-user-injured"></i>
              </div>
              <div class="stat-value">248</div>
              <div class="stat-label">Total Patients</div>
            </div>

            <div class="stat-card">
              <div class="stat-icon" style="color: #8b5cf6">
                <i class="fas fa-prescription-bottle"></i>
              </div>
              <div class="stat-value">42</div>
              <div class="stat-label">Prescriptions Today</div>
            </div>

            <div class="stat-card">
              <div class="stat-icon" style="color: #f59e0b">
                <i class="fas fa-clock"></i>
              </div>
              <div class="stat-value">3</div>
              <div class="stat-label">Pending Tasks</div>
            </div>
          </div>
        </div>

        <!-- Appointments Section -->
        <div id="appointments" class="content-section">
          <h2 style="margin-bottom: 20px; font-size: 1.5rem">
            Today's Appointments
          </h2>
          <div class="appointments-grid" id="appointmentsGrid">
            <!-- Appointments will be loaded here -->
          </div>
        </div>

        <!-- Prescription Section -->
        <div id="prescription" class="content-section">
          <div class="prescription-form">
            <div class="form-header">
              <h2>Write Prescription</h2>
              <button onclick="clearForm()">
                <i class="fas fa-redo"></i> Clear
              </button>
            </div>

            <form
              id="prescriptionForm"
              onsubmit="handlePrescriptionSubmit(event)"
            >
              <div class="form-grid">
                <div class="form-group">
                  <label for="patientName">Patient Name</label>
                  <input
                    type="text"
                    id="patientName"
                    placeholder="Enter patient name"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="patientPhone">Phone Number (WhatsApp)</label>
                  <input
                    type="tel"
                    id="patientPhone"
                    placeholder="Enter 10-digit number"
                    required
                  />
                </div>
              </div>

              <div class="form-grid">
                <div class="form-group">
                  <label for="diagnosis">Diagnosis</label>
                  <input
                    type="text"
                    id="diagnosis"
                    placeholder="Enter diagnosis"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="appointmentDate">Appointment Date</label>
                  <input type="date" id="appointmentDate" required />
                </div>
              </div>

              <div class="form-grid full">
                <div class="form-group">
                  <label for="medicines">Medicines</label>
                  <textarea
                    id="medicines"
                    placeholder="List medicines with dosage and duration&#10;E.g.:&#10;1. Amoxicillin 500mg - 2 times daily for 5 days&#10;2. Ibuprofen 400mg - After meals for pain relief"
                    required
                  ></textarea>
                </div>
              </div>

              <div class="form-grid full">
                <div class="form-group">
                  <label for="instructions">Special Instructions</label>
                  <textarea
                    id="instructions"
                    placeholder="Enter any special instructions or dietary recommendations"
                  ></textarea>
                </div>
              </div>

              <div class="form-grid full">
                <div class="form-group">
                  <label for="followUp">Follow-up Instructions</label>
                  <textarea
                    id="followUp"
                    placeholder="When should the patient return? Any specific conditions to watch for?"
                  ></textarea>
                </div>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn-primary">
                  <i class="fas fa-save"></i> Save & Generate PDF
                </button>
                <button
                  type="button"
                  class="btn-secondary"
                  onclick="handleWhatsAppShare()"
                >
                  <i class="fab fa-whatsapp"></i> Send via WhatsApp
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- History Section -->
        <div id="history" class="content-section">
          <h2 style="margin-bottom: 20px; font-size: 1.5rem">
            Prescription History
          </h2>
          <div
            id="prescriptionHistory"
            style="background: #fff; border-radius: 12px; padding: 20px"
          ></div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
      // Check if logged in
      window.addEventListener("load", function () {
        const doctorId = localStorage.getItem("doctorId");
        if (!doctorId) {
          window.location.href = "doctor-login.html";
        }
        loadAppointments();
        loadPrescriptionHistory();
      });

      function switchSection(sectionId) {
        // Hide all sections
        document.querySelectorAll(".content-section").forEach((section) => {
          section.classList.remove("active");
        });

        // Remove active from menu items
        document.querySelectorAll(".menu-item").forEach((item) => {
          item.classList.remove("active");
        });

        // Show selected section
        document.getElementById(sectionId).classList.add("active");

        // Add active to clicked menu item
        event.target.closest(".menu-item").classList.add("active");
      }

      function loadAppointments() {
        // Sample appointment data
        const appointments = [
          {
            patientName: "Rajesh Kumar",
            phone: "9876543210",
            time: "10:30 AM",
            treatment: "Root Canal Treatment",
            status: "Confirmed",
          },
          {
            patientName: "Priya Sharma",
            phone: "9123456789",
            time: "11:00 AM",
            treatment: "Teeth Whitening",
            status: "Confirmed",
          },
          {
            patientName: "Amit Patel",
            phone: "9987654321",
            time: "2:00 PM",
            treatment: "Dental Implant Consultation",
            status: "Pending",
          },
        ];

        const appointmentsGrid = document.getElementById("appointmentsGrid");
        appointmentsGrid.innerHTML = appointments
          .map(
            (apt) => `
        <div class="appointment-card">
          <div class="appointment-header">
            <h3>${apt.patientName}</h3>
            <span class="appointment-status">${apt.status}</span>
          </div>
          <div class="appointment-details">
            <p><strong>Time:</strong> ${apt.time}</p>
            <p><strong>Phone:</strong> ${apt.phone}</p>
            <p><strong>Treatment:</strong> ${apt.treatment}</p>
          </div>
          <div class="appointment-actions">
            <button class="btn-action btn-prescription" onclick="selectPatientAndPrescribe('${apt.patientName}', '${apt.phone}')">
              Write Prescription
            </button>
            <button class="btn-action btn-view">View Details</button>
          </div>
        </div>
      `,
          )
          .join("");
      }

      function selectPatientAndPrescribe(patientName, phone) {
        // Switch to prescription form and pre-fill patient data
        switchSection("prescription");
        document.getElementById("patientName").value = patientName;
        document.getElementById("patientPhone").value = phone;
        document.getElementById("patientName").focus();
      }

      function handlePrescriptionSubmit(event) {
        event.preventDefault();

        const prescription = {
          patientName: document.getElementById("patientName").value,
          patientPhone: document.getElementById("patientPhone").value,
          diagnosis: document.getElementById("diagnosis").value,
          medicines: document.getElementById("medicines").value,
          instructions: document.getElementById("instructions").value,
          followUp: document.getElementById("followUp").value,
          date: new Date().toLocaleDateString(),
          doctorName: "Dr. Humayun Aleem",
        };

        // Generate PDF
        generatePDF(prescription);
      }

      function generatePDF(prescription) {
        const element = document.createElement("div");
        element.innerHTML = `
        <div style="font-family: 'Segoe UI', Arial, sans-serif; padding: 0; line-height: 1.6; color: #333;">
          <!-- Main Border Container -->
          <div style="border: 3px solid #0f766e; margin: 20px; padding: 30px; background: #fff;">
            
            <!-- Header Section with Logo -->
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 3px solid #0f766e;">
              <div style="flex: 1;">
                <img src="assets/Clinic_logo_iamge.jpeg" style="height: 80px; width: 80px; object-fit: contain; margin-right: 20px;" alt="Clinic Logo" />
              </div>
              <div style="flex: 2; text-align: center;">
                <h1 style="margin: 0; color: #0f766e; font-size: 28px; font-weight: bold;">ASIAN DENTAL CLINIC</h1>
                <p style="margin: 8px 0; color: #059669; font-weight: 600; font-size: 13px;">Professional Dental Care Excellence</p>
                <p style="margin: 4px 0; color: #555; font-size: 12px;">44th 'A' Cross, M V Extension, Hoskote, Karnataka</p>
                <p style="margin: 4px 0; color: #555; font-size: 12px;">📞 Phone: +91-9663252315</p>
              </div>
              <div style="flex: 1; text-align: right;">
                <div style="background: #f0fdf4; border: 2px solid #059669; border-radius: 8px; padding: 10px; text-align: center;">
                  <p style="margin: 0; color: #059669; font-weight: bold; font-size: 11px;">RX</p>
                </div>
              </div>
            </div>

            <!-- Prescription Title -->
            <div style="background: linear-gradient(135deg, #0f766e 0%, #06b6d4 100%); color: white; padding: 12px 15px; margin-bottom: 25px; border-radius: 6px; text-align: center;">
              <h2 style="margin: 0; font-size: 18px; font-weight: bold; letter-spacing: 1px;">MEDICAL PRESCRIPTION</h2>
            </div>

            <!-- Patient Information Section -->
            <div style="background: #f8f9fa; border-left: 4px solid #0f766e; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                <div>
                  <p style="margin: 0; color: #666; font-size: 11px; font-weight: 600; text-transform: uppercase;">Patient Name</p>
                  <p style="margin: 8px 0 0 0; color: #333; font-size: 14px; font-weight: bold;">${prescription.patientName}</p>
                </div>
                <div>
                  <p style="margin: 0; color: #666; font-size: 11px; font-weight: 600; text-transform: uppercase;">Phone Number</p>
                  <p style="margin: 8px 0 0 0; color: #333; font-size: 14px; font-weight: bold;">+91-${prescription.patientPhone}</p>
                </div>
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                  <p style="margin: 0; color: #666; font-size: 11px; font-weight: 600; text-transform: uppercase;">Date of Consultation</p>
                  <p style="margin: 8px 0 0 0; color: #333; font-size: 14px; font-weight: bold;">${prescription.date}</p>
                </div>
                <div>
                  <p style="margin: 0; color: #666; font-size: 11px; font-weight: 600; text-transform: uppercase;">Consulting Doctor</p>
                  <p style="margin: 8px 0 0 0; color: #333; font-size: 14px; font-weight: bold;">${prescription.doctorName}</p>
                </div>
              </div>
            </div>

            <!-- Diagnosis Section -->
            <div style="margin-bottom: 25px;">
              <h3 style="margin: 0 0 12px 0; color: #0f766e; font-size: 13px; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid #0f766e; padding-bottom: 8px;">Diagnosis</h3>
              <p style="margin: 12px 0; color: #333; font-size: 13px; padding: 12px; background: #f8f9fa; border-radius: 4px; line-height: 1.6;">${prescription.diagnosis}</p>
            </div>

            <!-- Medicines Section -->
            <div style="margin-bottom: 25px;">
              <h3 style="margin: 0 0 12px 0; color: #0f766e; font-size: 13px; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid #0f766e; padding-bottom: 8px;">Prescribed Medicines</h3>
              <div style="background: #f8f9fa; border-left: 4px solid #059669; padding: 15px; border-radius: 4px;">
                <pre style="margin: 0; white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 12px; color: #333; line-height: 1.8;">${prescription.medicines}</pre>
              </div>
            </div>

            ${
              prescription.instructions
                ? `
            <!-- Instructions Section -->
            <div style="margin-bottom: 25px;">
              <h3 style="margin: 0 0 12px 0; color: #0f766e; font-size: 13px; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid #0f766e; padding-bottom: 8px;">Special Instructions</h3>
              <p style="margin: 12px 0; color: #333; font-size: 13px; padding: 12px; background: #f8f9fa; border-radius: 4px; line-height: 1.6;">${prescription.instructions}</p>
            </div>
          `
                : ""
            }

            ${
              prescription.followUp
                ? `
            <!-- Follow-up Section -->
            <div style="margin-bottom: 25px;">
              <h3 style="margin: 0 0 12px 0; color: #0f766e; font-size: 13px; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid #0f766e; padding-bottom: 8px;">Follow-up Instructions</h3>
              <p style="margin: 12px 0; color: #333; font-size: 13px; padding: 12px; background: #f8f9fa; border-radius: 4px; line-height: 1.6;">${prescription.followUp}</p>
            </div>
          `
                : ""
            }

            <!-- Footer Section -->
            <div style="margin-top: 40px; padding-top: 20px; border-top: 2px dashed #ddd;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div style="text-align: center; flex: 1;">
                  <p style="margin: 0 0 40px 0; color: #333; font-size: 12px; font-weight: bold;">Doctor's Signature</p>
                  <div style="border-top: 2px solid #333; width: 120px; margin: 0 auto;"></div>
                  <p style="margin: 8px 0 0 0; color: #666; font-size: 11px;">${prescription.doctorName}</p>
                </div>
                <div style="text-align: center; flex: 1;">
                  <p style="margin: 0; color: #333; font-size: 12px; font-weight: bold;">Date & Seal</p>
                  <p style="margin: 8px 0; color: #333; font-size: 13px; font-weight: bold;">${new Date().toLocaleDateString()}</p>
                </div>
              </div>
            </div>

            <!-- Validity Notice -->
            <div style="background: #fff3cd; border: 2px solid #ffc107; border-radius: 6px; padding: 12px; margin-top: 25px; text-align: center;">
              <p style="margin: 0; color: #856404; font-size: 11px; font-weight: 600;">✓ This prescription is valid for 30 days from the date of issue</p>
            </div>

            <!-- Clinic Footer -->
            <div style="text-align: center; margin-top: 25px; padding-top: 15px; border-top: 2px solid #0f766e;">
              <p style="margin: 0; color: #666; font-size: 10px;">Thank you for choosing Asian Dental Clinic | We care about your smile</p>
              <p style="margin: 5px 0 0 0; color: #999; font-size: 9px;">This is a computer-generated prescription. No signature is required.</p>
            </div>
          </div>
        </div>
      `;

        const opt = {
          margin: [10, 10, 10, 10],
          filename: `prescription_${prescription.patientName}_${Date.now()}.pdf`,
          image: { type: "jpeg", quality: 0.98 },
          html2canvas: { scale: 2, logging: false, useCORS: true, allowTaint: true },
          jsPDF: { orientation: "portrait", unit: "mm", format: "a4" },
        };

        html2pdf().set(opt).from(element).save();
        alert("Prescription saved as PDF!");
        savePrescriptionHistory(prescription);
        clearForm();
      }

      function handleWhatsAppShare() {
        const phone = document.getElementById("patientPhone").value;
        const patientName = document.getElementById("patientName").value;

        if (!phone || !patientName) {
          alert("Please fill in patient name and phone number first!");
          return;
        }

        const message = `Hi ${patientName}, your prescription from Asian Dental Clinic is ready. Please check your email for the PDF attachment or call us at 9663252315 for any queries. Thank you!`;
        const whatsappURL = `https://wa.me/91${phone}?text=${encodeURIComponent(message)}`;
        window.open(whatsappURL, "_blank");
      }

      function savePrescriptionHistory(prescription) {
        let history = JSON.parse(
          localStorage.getItem("prescriptionHistory") || "[]",
        );
        history.unshift(prescription);
        localStorage.setItem(
          "prescriptionHistory",
          JSON.stringify(history.slice(0, 50)),
        );
      }

      function loadPrescriptionHistory() {
        const history = JSON.parse(
          localStorage.getItem("prescriptionHistory") || "[]",
        );
        const historyDiv = document.getElementById("prescriptionHistory");

        if (history.length === 0) {
          historyDiv.innerHTML =
            '<p style="color: #999; text-align: center;">No prescriptions yet</p>';
          return;
        }

        historyDiv.innerHTML = history
          .map(
            (p, index) => `
        <div style="padding: 15px; border-bottom: 1px solid #eee;">
          <div style="display: flex; justify-content: space-between; align-items: start;">
            <div>
              <h4 style="margin: 0 0 5px 0; color: #0f172a;">${p.patientName}</h4>
              <p style="margin: 3px 0; font-size: 0.9rem; color: #666;">
                <strong>Date:</strong> ${p.date} | <strong>Diagnosis:</strong> ${p.diagnosis}
              </p>
            </div>
            <button onclick="alert('Patient: ${p.patientName}\\nDiagnosis: ${p.diagnosis}\\nDate: ${p.date}')" style="background: #059669; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">View</button>
          </div>
        </div>
      `,
          )
          .join("");
      }

      function clearForm() {
        document.getElementById("prescriptionForm").reset();
      }

      function handleLogout() {
        if (confirm("Are you sure you want to logout?")) {
          localStorage.removeItem("doctorId");
          localStorage.removeItem("doctorName");
          window.location.href = "index.html";
        }
      }
    </script>
  </body>
</html>
